<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Expense Tracker{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css', v='login') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Sidebar">
        <a class="brand" href="{{ url_for('index') }}" title="Expense Tracker">
            <span class="brand-mark" aria-hidden="true">$</span>
            <span class="sidebar-label">Expense Tracker</span>
        </a>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <a href="{{ url_for('index') }}" title="Dashboard"
               {% if request.endpoint == "index" %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
                <span class="sidebar-label">Dashboard</span>
            </a>
            <a href="{{ url_for('add_expense') }}" title="Add Expense"
               {% if request.endpoint in ("add_expense", "edit_expense") %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                <span class="sidebar-label">Add Expense</span>
            </a>
            <a href="{{ url_for('categories') }}" title="Categories"
               {% if request.endpoint in ("categories", "delete_category") %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.25"/></svg>
                <span class="sidebar-label">Categories</span>
            </a>
            <a href="{{ url_for('budgets') }}" title="Budgets"
               {% if request.endpoint in ("budgets", "delete_budget") %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 14h2M3 9h18M7 5V3m10 2V3"/></svg>
                <span class="sidebar-label">Budgets</span>
            </a>
            <a href="{{ url_for('export_expenses') }}" title="Export CSV">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
                <span class="sidebar-label">Export CSV</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="sidebar-footer-mark" aria-hidden="true">E</span>
            <span class="sidebar-label">{{ g.current_user.email }}</span>
            <form method="POST" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="sidebar-logout" type="submit" title="Sign out"
                        aria-label="Sign out">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
                </button>
            </form>
        </div>
    </aside>

    <button class="sidebar-scrim" type="button" aria-label="Close navigation"></button>

    <div class="app-content">
        <header class="site-header">
            <button class="sidebar-toggle" type="button"
                    aria-label="Collapse sidebar" aria-expanded="true"
                    aria-controls="app-sidebar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
                <span class="mobile-menu-label">Menu</span>
            </button>
        </header>

        <main>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script>
document.addEventListener("submit", function (event) {
    if (event.target.matches(".preserve-scroll-on-submit")) {
        sessionStorage.setItem(
            "expense-tracker:scroll-position",
            `${window.scrollX},${window.scrollY}`
        );
    }
});

document.addEventListener("DOMContentLoaded", function () {
    const sidebarToggle = document.querySelector(".sidebar-toggle");
    const mobileSidebar = window.matchMedia("(max-width: 720px)");

    function updateSidebarToggle() {
        const expanded = mobileSidebar.matches
            ? document.body.classList.contains("sidebar-open")
            : !document.body.classList.contains("sidebar-collapsed");
        sidebarToggle.setAttribute("aria-expanded", String(expanded));
        sidebarToggle.setAttribute(
            "aria-label",
            mobileSidebar.matches
                ? (expanded ? "Close navigation" : "Open navigation")
                : (expanded ? "Collapse sidebar" : "Expand sidebar")
        );
    }

    sidebarToggle.addEventListener("click", function () {
        if (mobileSidebar.matches) {
            document.body.classList.toggle("sidebar-open");
        } else {
            document.body.classList.toggle("sidebar-collapsed");
        }
        updateSidebarToggle();
    });

    document.querySelector(".sidebar-scrim").addEventListener("click", function () {
        document.body.classList.remove("sidebar-open");
        updateSidebarToggle();
    });

    document.addEventListener("keydown", function (event) {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "b") {
            event.preventDefault();
            sidebarToggle.click();
        }
        if (event.key === "Escape") {
            document.body.classList.remove("sidebar-open");
            updateSidebarToggle();
        }
    });

    mobileSidebar.addEventListener("change", function () {
        document.body.classList.remove("sidebar-open");
        document.body.classList.remove("sidebar-collapsed");
        updateSidebarToggle();
    });
    updateSidebarToggle();

    const savedPosition = sessionStorage.getItem(
        "expense-tracker:scroll-position"
    );
    if (!savedPosition) return;

    sessionStorage.removeItem("expense-tracker:scroll-position");
    const [x, y] = savedPosition.split(",").map(Number);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;

    requestAnimationFrame(function () {
        window.scrollTo(x, y);
    });
});
</script>

</body>
</html>
