{% extends "auth_base.html" %}

{% block title %}Sign in | Expense Tracker{% endblock %}

{% block content %}
<div class="auth-heading">
    <span class="auth-eyebrow">WELCOME BACK</span>
    <h1 id="auth-title">Good to see you.</h1>
    <p>Sign in to pick up where you left off.</p>
</div>

<form class="auth-form" method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
    {% endif %}

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username"
           placeholder="you@example.com" maxlength="254" required autofocus>

    <div class="auth-label-row">
        <label for="password">Password</label>
    </div>
    <div class="password-field">
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Your password"
               maxlength="1024" required>
        <button class="password-toggle" type="button" aria-label="Show password"
                aria-pressed="false" data-password-toggle="password">Show</button>
    </div>
    <p class="caps-warning" aria-live="polite">Caps Lock is on.</p>

    <label class="remember-option">
        <input type="checkbox" name="remember">
        <span>Keep me signed in for 30 days</span>
    </label>

    <button class="auth-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
</form>

<p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create your own account</a></p>

<script>
document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
    button.addEventListener("click", function () {
        const field = document.getElementById(button.dataset.passwordToggle);
        const visible = field.type === "password";
        field.type = visible ? "text" : "password";
        button.textContent = visible ? "Hide" : "Show";
        button.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        button.setAttribute("aria-pressed", String(visible));
        field.focus();
    });
});

const passwordField = document.getElementById("password");
const capsWarning = document.querySelector(".caps-warning");
passwordField.addEventListener("keyup", function (event) {
    capsWarning.classList.toggle("is-visible", event.getModifierState("CapsLock"));
});
passwordField.addEventListener("blur", function () {
    capsWarning.classList.remove("is-visible");
});
</script>
{% endblock %}
